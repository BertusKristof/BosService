<main class="registration-container">
  <section class="register-section">
    <div class="register-form">
      <h2>Regisztráció</h2>
      <form (ngSubmit)="register()">
        <div class="form-group">
          <label for="name">Teljes név</label>
          <input type="text" id="name" [(ngModel)]="registerData.name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email cím</label>
          <input type="email" id="email" [(ngModel)]="registerData.email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Jelszó</label>
          <input type="password" id="password" [(ngModel)]="registerData.password" name="password" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Jelszó megerősítése</label>
          <input type="password" id="confirmPassword" [(ngModel)]="registerData.confirmPassword" name="confirmPassword" required>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <button type="submit" class="register-button">Regisztráció</button>
      </form>

      <div class="login-prompt">
        <p>Már van fiókja? <a routerLink="/login">Bejelentkezés</a></p>
      </div>
    </div>
  </section>
</main>
