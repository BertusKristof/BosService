<main class="container">
  <section class="login-section">
    <h2>Bejelentkezés</h2>
    
    <!-- Bejelentkezési űrlap -->
    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label for="login_email">Email cím</label>
        <input type="email" id="login_email" 
               [(ngModel)]="loginData.login_email" 
               name="login_email" 
               required
               placeholder="Add meg az email címed">
      </div>
      
      <div class="form-group">
        <label for="login_password">Jelszó</label>
        <input type="password" id="login_password" 
               [(ngModel)]="loginData.login_password" 
               name="login_password" 
               required
               placeholder="Add meg a jelszavad">
      </div>
      
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      
      <button type="submit" class="login-button">Bejelentkezés</button>
      
      <a class="forgot-password" (click)="openPasswordModal()">
        Elfelejtette a jelszavát?
      </a>
    </form>
  </section>
  
  <!-- Regisztrációs szekció -->
  <section class="register-section">
    <p>Még nincs fiókja?</p>
    <a routerLink="/register" class="register-link">
      Regisztráció
    </a>
  </section>
  
  <!-- Jelszóemlékeztető modal -->
  <div *ngIf="showPasswordModal" class="password-modal">
    <div class="modal-content">
      <span class="close-button" (click)="closePasswordModal()">&times;</span>
      
      <h2>Jelszó visszaállítás</h2>
      
      <form (ngSubmit)="submitPasswordModal()" class="password-form">
        <div class="form-group">
          <label for="reset_email">Email cím</label>
          <input type="email" id="reset_email" 
                 [(ngModel)]="modalData.email" 
                 name="email"
                 required
                 placeholder="Add meg a regisztrált email címed">
        </div>
        
        <div class="form-group">
          <label for="new_password">Új jelszó</label>
          <input type="password" id="new_password" 
                 [(ngModel)]="modalData.newPassword" 
                 name="newPassword"
                 required
                 placeholder="Új jelszó">
        </div>
        
        <div class="form-group">
          <label for="confirm_password">Jelszó megerősítése</label>
          <input type="password" id="confirm_password" 
                 [(ngModel)]="modalData.confirmPassword" 
                 name="confirmPassword"
                 required
                 placeholder="Jelszó mégegyszer">
        </div>
        
        <button type="submit" class="submit-button">Jelszó visszaállítása</button>
      </form>
    </div>
  </div>
</main>
