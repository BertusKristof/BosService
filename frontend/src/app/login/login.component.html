<section class="login-section">
  <div class="login-container">
    <h2>Bejelentkezés</h2>
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="login_email">Felhasználónév</label>
        <input type="text" id="login_email" [(ngModel)]="loginData.login_email" name="login_email" required>
      </div>
      
      <div class="form-group">
        <label for="login_password">Jelszó</label>
        <input type="password" id="login_password" [(ngModel)]="loginData.login_password" name="login_password" required>
      </div>
      
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      
      <a class="forgot-password" (click)="showLoginModal()">Elfelejtette a jelszavát?</a>
      <button type="submit" class="login-button">Bejelentkezés</button>
    </form>
    
    <div class="register-prompt">
      <p>Még nincs fiókja?</p>
      <a href="/register" class="register-link">Regisztráció</a>
    </div>
  </div>

  <!-- Jelszóváltoztatás modal -->
  <div id="login_myModal" class="login-modal" [class.active]="modalOpen">
    <div class="modal-content">
      <span class="close" (click)="closeLoginModal()">&times;</span>
      <h2>Jelszó változtatás</h2>
      <form (ngSubmit)="submitLoginModal()">
        <div class="form-group">
          <label>Email cím:</label>
          <input type="text" [(ngModel)]="modalData.email" name="email">
        </div>
        <div class="form-group">
          <label>Új jelszó:</label>
          <input type="password" [(ngModel)]="modalData.newPassword" name="newPassword">
        </div>
        <div class="form-group">
          <label>Új jelszó megerősítés:</label>
          <input type="password" [(ngModel)]="modalData.confirmPassword" name="confirmPassword">
        </div>
        <button type="submit" class="modal-button">Küldés</button>
      </form>
    </div>
  </div>
</section>
