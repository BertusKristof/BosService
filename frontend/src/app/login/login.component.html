<main class="container">
  <section class="login-section">
    <div class="login-container">
      <h2>Bejelentkezés</h2>
      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="login_email">Felhasználónév</label>
          <input type="text" id="login_email" [(ngModel)]="loginData.login_email" name="login_email" required>
        </div>
        
        <div class="form-group">
          <label for="login_password">Jelszó</label>
          <input type="password" id="login_password" [(ngModel)]="loginData.login_password" name="login_password" required>
        </div>
        
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
        
        <a class="forgot-password" (click)="showEmailModal()">Elfelejtette a jelszavát?</a>
        <button type="submit" class="login-button">Bejelentkezés</button>
      </form>
      
      <div class="register-prompt">
        <p>Még nincs fiókja?</p>
        <a href="/register" class="register-link">Regisztráció</a>
      </div>
    </div>
  </section>

  <div id="emailModal" class="login-modal">
    <div class="modal-content">
      <span class="close" (click)="closeEmailModal()">&times;</span>
      <h2>E-mail megadása</h2>
      <input type="email" [(ngModel)]="email" placeholder="Adja meg az e-mail címét" required>
      <button (click)="verifyEmail()" class="modal-button">Tovább</button>
    </div>
  </div>

  <div id="passwordModal" class="login-modal">
    <div class="modal-content">
      <span class="close" (click)="closePasswordModal()">&times;</span>
      <h2>Új jelszó beállítása</h2>
      <div class="form-group">
        <label>Új jelszó:</label>
        <input type="password" [(ngModel)]="newPassword" placeholder="Új jelszó" required>
      </div>
      <div class="form-group">
        <label>Új jelszó megerősítése:</label>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="Új jelszó megerősítése" required>
      </div>
      <p *ngIf="newPassword && confirmPassword && newPassword !== confirmPassword" style="color: red;">
        A jelszavak nem egyeznek!
      </p>
      <p *ngIf="newPassword && confirmPassword && newPassword === confirmPassword" style="color: green;">
        A jelszavak egyeznek!
      </p>
      <button [disabled]="newPassword !== confirmPassword" (click)="changePassword()" class="modal-button">Jelszó megváltoztatása</button>
    </div>
  </div>
</main>
